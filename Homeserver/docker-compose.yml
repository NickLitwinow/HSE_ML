version: "3.8"

# Default logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  proxy-net:
    name: proxy-net
  internal-net:
    name: internal-net

volumes:
  npm-data:
  npm-letsencrypt:
  pg-data:
  redis-data:
  immich-upload:
  ocis-data:
  ocis-config:
  jellyfin-config:
  jellyfin-cache:


services:
  # ---------------------------------------------------------------------------
  # CORE SERVICES
  # ---------------------------------------------------------------------------

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '${NPM_HTTP_PORT}:80'
      - '${NPM_HTTPS_PORT}:443'
      - '${NPM_ADMIN_PORT}:81'
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy-net
      - internal-net
    mem_limit: 512m
    logging: *default-logging

  postgres:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
    volumes:
      - ${SSD_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - internal-net
    command: [ "postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200" ]
    mem_limit: 1g
    logging: *default-logging

  redis:
    image: redis:6.2-alpine
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal-net
    mem_limit: 256m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # IMMICH (Photos)
  # ---------------------------------------------------------------------------

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    command: [ 'start.sh', 'immich' ]
    volumes:
      - ${SATA_ROOT}/immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
    networks:
      - internal-net
      - proxy-net
    depends_on:
      - redis
      - postgres
    restart: always
    mem_limit: 1536m
    logging: *default-logging

  immich-microservices:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_microservices
    command: [ 'start.sh', 'microservices' ]
    volumes:
      - ${SATA_ROOT}/immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
    networks:
      - internal-net
    depends_on:
      - redis
      - postgres
    restart: always
    mem_limit: 1536m
    logging: *default-logging

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: immich_machine_learning
    volumes:
      - ${SATA_ROOT}/immich-cache:/cache
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
      # IMPORTANT: Limit concurrency to save RAM
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
    networks:
      - internal-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # COMMUNICATION (Matrix)
  # ---------------------------------------------------------------------------

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    restart: unless-stopped
    volumes:
      - ${SSD_ROOT}/synapse:/data
    environment:
      - SYNAPSE_SERVER_NAME=${MATRIX_SERVER_NAME}
      - SYNAPSE_REPORT_STATS=${MATRIX_REPORT_STATS}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=synapse
    networks:
      - internal-net
      - proxy-net
    depends_on:
      - postgres
      - redis
    mem_limit: 1g
    logging: *default-logging

  synapse-admin:
    image: awesometechnologies/synapse-admin:latest
    container_name: synapse-admin
    restart: unless-stopped
    networks:
      - proxy-net
    mem_limit: 128m
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./config/livekit/livekit.yaml:/etc/livekit.yaml
      - npm-letsencrypt:/etc/letsencrypt:ro
    network_mode: host
    depends_on:
      - redis
    mem_limit: 512m
    logging: *default-logging

  element-call-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: element-call-jwt
    restart: unless-stopped
    environment:
      - LIVEKIT_URL=wss://livekit.${DOMAIN}
      - LIVEKIT_KEY=921e74ba89a90b9ed90fa80a6cf49722cb4ec3b3dc6ce03d2fd1318ecfc93694
      - LIVEKIT_SECRET=3b981df37527126a60cc9f7891e24ca65994366b857cb9cd10bdfe05401e33f9
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=matrix.${DOMAIN}
      - LK_JWT_PORT=8080
    networks:
      - proxy-net
    mem_limit: 128m
    logging: *default-logging

  element:
    image: vectorim/element-web:latest
    container_name: element
    restart: unless-stopped
    volumes:
      - ./config/element/config.json:/app/config.json
    networks:
      - proxy-net
    mem_limit: 128m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # FILES & PRODUCTIVITY
  # ---------------------------------------------------------------------------

  ocis:
    image: owncloud/ocis:latest
    container_name: ocis
    restart: always
    environment:
      OCIS_INSECURE: "true"
      OCIS_URL: "https://drive.${DOMAIN}"
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      OCIS_LOG_LEVEL: "info"
      OCIS_JWT_SECRET: "${OCIS_JWT_SECRET}"
      OCIS_TRANSFER_SECRET: "${OCIS_TRANSFER_SECRET}"
      OCIS_MACHINE_AUTH_API_KEY: "${OCIS_MACHINE_AUTH_API_KEY}"
      OCIS_SYSTEM_USER_ID: "${OCIS_SYSTEM_USER_ID}"
      # IDs handled by OCIS internally or generated on first run
      # Fix for reverse proxy
      PROXY_TLS: "false"
      
      # Fix for Nextcloud mobile apps
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      OCIS_OIDC_ISSUER: "https://drive.${DOMAIN}"
      
      PROXY_TRANSPORT_TLS_CERT: ""
      PROXY_TRANSPORT_TLS_KEY: ""
      
    extra_hosts:
      - "drive.${DOMAIN}:172.18.0.1"
    volumes:
      - ocis-config:/etc/ocis
      - ${SATA_ROOT}/ocis:/var/lib/ocis
    networks:
      - proxy-net
    mem_limit: 256m
    logging: *default-logging

  joplin:
    image: joplin/server:latest
    container_name: joplin
    restart: unless-stopped
    ports:
      - "22300:22300"
    environment:
      - APP_PORT=22300
      - APP_BASE_URL=https://joplin.${DOMAIN}
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DATABASE=joplin
      - POSTGRES_USER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=postgres
    networks:
      - internal-net
      - proxy-net
    depends_on:
      - postgres
    mem_limit: 512m
    logging: *default-logging

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # Basic Configuration
      - DOMAIN=https://pass.${DOMAIN}
      - ROCKET_WORKERS=10
      
      # Security - Registration (keep open until users are created)
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      - INVITATIONS_ALLOWED=true
      - SIGNUPS_VERIFY=false
      - SHOW_PASSWORD_HINT=false
      
      # Admin Panel
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      
      # Email Configuration (SMTP)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_FROM=${SMTP_FROM:-noreply@litwein.bond}
      - SMTP_FROM_NAME=Vaultwarden
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      
      # Security Enhancements
      - PASSWORD_ITERATIONS=600000
      - EXTENDED_LOGGING=true
      - LOG_LEVEL=info
      
      # Database
      - DATABASE_MAX_CONNS=10
      
    volumes:
      - ${SSD_ROOT}/vaultwarden:/data
    networks:
      - proxy-net
    mem_limit: 256m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MEDIA & ENTERTAINMENT
  # ---------------------------------------------------------------------------

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${SATA_ROOT}/media:/media
    networks:
      - proxy-net
    # devices:
    #   - /dev/dri:/dev/dri # Enable for Intel QuickSync
    mem_limit: 1g
    logging: *default-logging

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - ${SSD_ROOT}/navidrome:/data
      - ${SATA_ROOT}/media/music:/music:ro
    networks:
      - proxy-net
    mem_limit: 256m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ARR STACK (Downloads)
  # ---------------------------------------------------------------------------

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${SSD_ROOT}/prowlarr:/config
    networks:
      - internal-net
      - proxy-net
    mem_limit: 256m
    logging: *default-logging

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${SSD_ROOT}/lidarr:/config
      - ${SATA_ROOT}/media/music:/music
      - ${SATA_ROOT}/downloads:/downloads
    networks:
      - internal-net
      - proxy-net
    mem_limit: 512m
    logging: *default-logging

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${SSD_ROOT}/qbittorrent:/config
      - ${SATA_ROOT}/downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - internal-net
      - proxy-net
    mem_limit: 512m
    logging: *default-logging

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks:
      - internal-net
    mem_limit: 512m
    logging: *default-logging
